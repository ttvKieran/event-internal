# Docker Compose — Multi-container orchestration
# Run: docker compose up --build
# Docs: https://docs.docker.com/compose/

services:
#  # ─── Frontend ────────────────────────────────────
#  frontend:
#    build: ./frontend
#    ports:
#      - "${FRONTEND_PORT:-3000}:3000"
#    depends_on:
#      - gateway
#    networks:
#      - app-network
#
  # ─── API Gateway ─────────────────────────────────
  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      - iam-service
    environment:
      - IAM_SERVICE_URL=http://iam-service:8085
      - JWT_SECRET=${JWT_SECRET:-my_super_secret_jwt_key_12345}
    networks:
      - app-network

  # ─── IAM Service ─────────────────────────────────
  iam-service:
    build: ./services/iam-service
    container_name: iam-service
    ports:
      - "${IAM_SERVICE_PORT:-8085}:8085"
    depends_on:
      - iam-db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://iam-db:5432/${IAM_DB_NAME:-employee_db}
      - DB_USERNAME=${IAM_DB_USER:-postgres}
      - DB_PASSWORD=${IAM_DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-my_super_secret_jwt_key_12345}
      - SPRING_SQL_INIT_MODE=always
    networks:
      - app-network

  # ─── Database for IAM ────────────────────────────
  iam-db:
    image: postgres:16-alpine
    container_name: iam-db
    ports:
      - "${IAM_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${IAM_DB_NAME:-employee_db}
      POSTGRES_USER: ${IAM_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${IAM_DB_PASSWORD:-postgres}
    volumes:
      - iam-db-data:/var/lib/postgresql/data
    networks:
      - app-network

  # ─── Shared Infrastructure (Event DB) ────────────
  event-db:
    image: quay.io/debezium/postgres:16
    ports:
      - "${EVENT_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-event_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - event-db-data:/var/lib/postgresql/data
    networks:
      - app-network

  registration-db:
    image: quay.io/debezium/postgres:16
    ports:
      - "${REGISTRATION_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${REGISTRATION_DB_NAME:-registration_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - registration_db_data:/var/lib/postgresql/data
    networks:
      - app-network

  payment-db:
    image: quay.io/debezium/postgres:16
    ports:
      - "${PAYMENT_DB_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-payment_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    networks:
      - app-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT:-2181}
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_PORT:-2181}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT:-29092},PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - app-network

  debezium:
    image: quay.io/debezium/connect:2.5
    ports:
      - "${DEBEZIUM_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:${KAFKA_INTERNAL_PORT:-29092}
      GROUP_ID: ${DEBEZIUM_GROUP_ID:-1}

      CONFIG_STORAGE_TOPIC: ${DEBEZIUM_CONFIG_TOPIC:-my_connect_configs}
      OFFSET_STORAGE_TOPIC: ${DEBEZIUM_OFFSET_TOPIC:-my_connect_offsets}
      STATUS_STORAGE_TOPIC: ${DEBEZIUM_STATUS_TOPIC:-my_connect_statuses}
    depends_on:
      - kafka
      - event-db
    networks:
      - app-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTER_NAME:-local}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:${KAFKA_INTERNAL_PORT:-29092}
    depends_on:
      - kafka
    networks:
      - app-network

  debezium-init:
    image: curlimages/curl:latest
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-event_db}
      - DB_HOST=event-db
      - EVENT_DB_PORT=5432
      - DEBEZIUM_HOST=debezium
      - DEBEZIUM_PORT=8083
      - CONNECTOR_NAME=event-outbox-connector
      - TOPIC_PREFIX=vtit
      - TABLE_INCLUDE_LIST=public.outbox_events
      - ROUTE_TOPIC_REPLACEMENT=Event
    volumes:
      - ./scripts:/scripts:ro
    command: [ "sh", "/scripts/debezium/register-connector.sh" ]
    depends_on:
      - debezium
    restart: "no"
    networks:
      - app-network

  registration-debezium-init:
    image: curlimages/curl:latest
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${REGISTRATION_DB_NAME:-registration_db}
      - DB_HOST=registration-db
      - EVENT_DB_PORT=5432
      - DEBEZIUM_HOST=debezium
      - DEBEZIUM_PORT=8083
      - CONNECTOR_NAME=registration-outbox-connector
      - TOPIC_PREFIX=vtit
      - TABLE_INCLUDE_LIST=public.outbox_events
      - ROUTE_TOPIC_REPLACEMENT=Registration
    volumes:
      - ./scripts:/scripts:ro
    command: [ "sh", "/scripts/debezium/register-connector.sh" ]
    depends_on:
      - debezium
      - registration-db
    restart: "no"
    networks:
      - app-network

  payment-debezium-init:
    image: curlimages/curl:latest
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${PAYMENT_DB_NAME:-payment_db}
      - DB_HOST=payment-db
      - EVENT_DB_PORT=5432
      - DEBEZIUM_HOST=debezium
      - DEBEZIUM_PORT=8083
      - CONNECTOR_NAME=payment-outbox-connector
      - TOPIC_PREFIX=vtit
      - TABLE_INCLUDE_LIST=public.outbox_events
      - ROUTE_TOPIC_REPLACEMENT=Payment
    volumes:
      - ./scripts:/scripts:ro
    command: [ "sh", "/scripts/debezium/register-connector.sh" ]
    depends_on:
      - debezium
      - payment-db
    restart: "no"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  event-db-data:
  iam-db-data:
  registration_db_data:
  payment_db_data:

