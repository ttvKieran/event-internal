# Docker Compose — Multi-container orchestration
# Run: docker compose up --build
# Docs: https://docs.docker.com/compose/

services:
#  # ─── Frontend ────────────────────────────────────
#  frontend:
#    build: ./frontend
#    ports:
#      - "${FRONTEND_PORT:-3000}:3000"
#    depends_on:
#      - gateway
#    networks:
#      - app-network
#
  # ─── API Gateway ─────────────────────────────────
  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      - iam-service
    environment:
      - IAM_SERVICE_URL=http://iam-service:8085
      - JWT_SECRET=${JWT_SECRET:-my_super_secret_jwt_key_12345}
    networks:
      - app-network

  # ─── IAM Service ─────────────────────────────────
  iam-service:
    build: ./services/iam-service
    container_name: iam-service
    ports:
      - "${IAM_SERVICE_PORT:-8085}:8085"
    depends_on:
      - iam-db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://iam-db:5432/${IAM_DB_NAME:-employee_db}
      - DB_USERNAME=${IAM_DB_USER:-postgres}
      - DB_PASSWORD=${IAM_DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-my_super_secret_jwt_key_12345}
      - SPRING_SQL_INIT_MODE=always
    networks:
      - app-network

  # ─── Database for IAM ────────────────────────────
  iam-db:
    image: postgres:16-alpine
    container_name: iam-db
    ports:
      - "${IAM_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${IAM_DB_NAME:-employee_db}
      POSTGRES_USER: ${IAM_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${IAM_DB_PASSWORD:-postgres}
    volumes:
      - iam-db-data:/var/lib/postgresql/data
    networks:
      - app-network

  # ─── Shared Infrastructure (Event DB) ────────────
  event-db:
    image: postgres:16-alpine
    ports:
      - "${EVENT_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-event_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - event-db-data:/var/lib/postgresql/data
    networks:
      - app-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT:-2181}
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_PORT:-2181}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT:-29092},PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  event-db-data:
  iam-db-data:
