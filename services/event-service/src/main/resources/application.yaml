server:
  port: ${EVENT_SERVICE_PORT:8082}

spring:
  application:
    name: event-service

  # Cấu hình Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:event_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # Cấu hình JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Cấu hình Kafka
  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    producer:
      # Key ID chuỗi nên dùng StringSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Value là JSON Object nên dùng JsonSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Không tự động gán metadata về Type (Tên Class) vào JSON header
        spring.json.add.type.headers: false
