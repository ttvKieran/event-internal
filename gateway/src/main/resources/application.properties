spring.config.import=optional:file:.env[.properties]

server.port=8000
spring.application.name=gateway

# Route Public
spring.cloud.gateway.routes[0].id=iam-public
spring.cloud.gateway.routes[0].uri=http://localhost:8085
spring.cloud.gateway.routes[0].predicates[0]=Path=/v1/auth/login, /v1/auth/refresh-token, /v1/auth/logout

# Route Secured
spring.cloud.gateway.routes[1].id=iam-secured
spring.cloud.gateway.routes[1].uri=http://localhost:8085
spring.cloud.gateway.routes[1].predicates[0]=Path=/v1/auth/me, /v1/Employees/**
spring.cloud.gateway.routes[1].filters[0]=JwtAuthenticationFilter

# Route Event
spring.cloud.gateway.routes[2].id=event-service-route
spring.cloud.gateway.routes[2].uri=http://localhost:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/v1/events/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthenticationFilter

jwt.secret=${JWT_SECRET}
