global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: event-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["event-service:8082"]

  - job_name: registration-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["registration-service:8083"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8084"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8087"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
