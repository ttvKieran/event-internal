openapi: 3.0.3
info:
  title: Payment Service - REST API
  version: 1.0.0
servers:
  - url: https://api.events.internal.company.vn/v1
    description: Production (qua API Gateway, mục 3.1 Context Map)
  - url: https://api.events.staging.company.vn/v1
    description: Staging
paths:
  /payments/vnpay-ipn:
    get:
      tags:
        - Payment
      summary: Webhook callback từ VNPay (IPN)
      description: 'VNPay gọi ngầm qua GET request để báo kết quả thanh toán. Payment Service xử lý chữ ký bảo mật và cập nhật giao dịch.'
      operationId: vnPayIpn
      security: []
      parameters:
        - name: vnp_TxnRef
          in: query
          required: true
          schema:
            type: string
          description: ID của Registration (hoặc Order)
        - name: vnp_TransactionNo
          in: query
          required: true
          schema:
            type: string
          description: Mã giao dịch tại VNPay
        - name: vnp_ResponseCode
          in: query
          required: true
          schema:
            type: string
          description: Mã phản hồi từ VNPay (00 = Thành công)
        - name: vnp_SecureHash
          in: query
          required: true
          schema:
            type: string
          description: Chữ ký bảo mật HMAC-SHA512
      responses:
        '200':
          description: Đã tiếp nhận webhook. Phản hồi chuẩn cho VNPay.
          content:
            application/json:
              schema:
                type: object
                properties:
                  RspCode:
                    type: string
                    example: '00'
                  Message:
                    type: string
                    example: Confirm Success
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
components:
  schemas:
    ErrorResponse:
      type: object
      description: Envelope Response DTO dùng chung cho mọi API lỗi (Trường phái B).
      required:
        - success
        - code
        - message
        - timestamp
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: INVALID_INPUT
        message:
          type: string
          example: Dữ liệu yêu cầu không hợp lệ.
        data:
          type: object
          nullable: true
          example: null
        timestamp:
          type: string
          format: date-time
          example: '2026-08-13T08:00:00.000Z'
        path:
          type: string
          example: /v1/auth/login
  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: BAD_REQUEST
            message: Dữ liệu đầu vào không hợp lệ.
            data: null
            timestamp: '2026-08-13T08:00:00.000Z'
            path: /v1/api
    Unauthorized:
      description: Thiếu hoặc JWT không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: UNAUTHORIZED
            message: Xác thực không thành công hoặc JWT hết hạn.
            data: null
            timestamp: '2026-08-13T08:00:00.000Z'
            path: /v1/api
    Forbidden:
      description: Role JWT không đủ quyền (vd. cần ORGANIZER).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: FORBIDDEN
            message: Tài khoản không đủ quyền truy cập tài nguyên này.
            data: null
            timestamp: '2026-08-13T08:00:00.000Z'
            path: /v1/api
    NotFound:
      description: Không tìm thấy tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: NOT_FOUND
            message: Tài nguyên được yêu cầu không tồn tại.
            data: null
            timestamp: '2026-08-13T08:00:00.000Z'
            path: /v1/api
    Conflict:
      description: Xung đột trạng thái (vd. đã PUBLISHED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: CONFLICT
            message: Xung đột trạng thái tài nguyên.
            data: null
            timestamp: '2026-08-13T08:00:00.000Z'
            path: /v1/api
  parameters:
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
