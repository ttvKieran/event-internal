asyncapi: 2.6.0
info:
  title: Notification Service - Async API
  version: 1.0.0
servers:
  productionBroker:
    url: http://localhost:9092
    protocol: kafka
channels:
  Registration:
    description: Lắng nghe các sự kiện từ Registration Service để gửi email thông báo.
    subscribe:
      operationId: onRegistrationEvent
      summary: Lắng nghe RegistrationConfirmedEvent và PaidRegistrationRolledBackEvent.
      message:
        oneOf:
          - $ref: '#/components/messages/RegistrationConfirmedEvent'
          - $ref: '#/components/messages/PaidRegistrationRolledBackEvent'
  Event:
    description: Lắng nghe các sự kiện từ Event Service để thông báo khi sự kiện bị hủy.
    subscribe:
      operationId: onEventEvent
      summary: Lắng nghe EventCancelledEvent.
      message:
        $ref: '#/components/messages/EventCancelledEvent'
components:
  schemas:
    RegistrationConfirmedEventPayload:
      type: object
      properties:
        registrationId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        confirmedAt:
          type: string
          format: date-time
    PaidRegistrationRolledBackEventPayload:
      type: object
      properties:
        registrationId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        reason:
          type: string
        rolledBackAt:
          type: string
          format: date-time
    EventCancelledEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        reason:
          type: string
        cancelledAt:
          type: string
          format: date-time
  messages:
    RegistrationConfirmedEvent:
      messageId: RegistrationConfirmedEvent
      name: RegistrationConfirmedEvent
      title: RegistrationConfirmedEvent
      summary: Nhận khi đăng ký vé thành công để gửi email xác nhận.
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/RegistrationConfirmedEventPayload'
    PaidRegistrationRolledBackEvent:
      messageId: PaidRegistrationRolledBackEvent
      name: PaidRegistrationRolledBackEvent
      title: PaidRegistrationRolledBackEvent
      summary: Nhận khi đăng ký vé bị hủy để gửi email thông báo lỗi thanh toán.
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/PaidRegistrationRolledBackEventPayload'
    EventCancelledEvent:
      messageId: EventCancelledEvent
      name: EventCancelledEvent
      title: EventCancelledEvent
      summary: Nhận khi sự kiện bị hủy để gửi email thông báo cho người tham gia.
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/EventCancelledEventPayload'
  messageTraits:
    eventTrait:
      headers:
        type: object
        required:
          - messageId
          - eventType
        properties:
          messageId:
            type: string
            format: uuid
            description: Phục vụ Idempotency tại Consumer.
          eventType:
            type: string
            description: Tên của sự kiện để phân loại xử lý.
