asyncapi: 2.6.0
info:
  title: Registration Service - Async API
  version: 1.0.0
servers:
  productionBroker:
    url: localhost:9092
    protocol: kafka

channels:
  Registration:
    description: 'Domain Events của Aggregate `Registration` (Core Domain). Publisher — Registration Service. Bắn ra để Payment Service nghe (bắt đầu Saga), hoặc để Analytics/Notification cập nhật.'
    publish:
      operationId: emitRegistrationEvent
      summary: Registration Service phát sự kiện vòng đời đăng ký.
      message:
        oneOf:
          - $ref: '#/components/messages/RegistrationRequestedEvent'
          - $ref: '#/components/messages/RegistrationConfirmedEvent'
          - $ref: '#/components/messages/PaidRegistrationRolledBackEvent'
          - $ref: '#/components/messages/RegistrationCancelledEvent'
  registration-commands:
    description: 'Kênh điều phối Saga Orchestration. Lắng nghe các lệnh điều khiển từ Orchestrator (hiện tại là RegistrationSagaManager nội bộ, tương lai có thể tách riêng thành Service độc lập).'
    subscribe:
      operationId: onRegistrationCommand
      summary: Core Domain nhận lệnh xử lý luồng Saga thanh toán.
      message:
        oneOf:
          - $ref: '#/components/messages/ConfirmPaidRegistrationCommand'
          - $ref: '#/components/messages/RollbackPaidRegistrationCommand'
          - $ref: '#/components/messages/AsyncReserveTicketCommand'
  Event:
    description: 'Lắng nghe các sự kiện từ Event Service để đồng bộ dữ liệu (Event Choreography). Khớp 100% với file EventKafkaListener.java.'
    subscribe:
      operationId: onEventServiceEvent
      summary: Lắng nghe vòng đời của Event để mở/đóng/hủy Campaign.
      message:
        oneOf:
          - $ref: 'event-service-async.yaml#/components/messages/EventDetailsConfiguredEvent'
          - $ref: 'event-service-async.yaml#/components/messages/EventPublishedEvent'
          - $ref: 'event-service-async.yaml#/components/messages/EventCancelledEvent'
  Payment:
    description: 'RegistrationSagaManager nội bộ lắng nghe kết quả thanh toán từ Payment Service để phát ra Command ném vào kênh registration-commands.'
    subscribe:
      operationId: onPaymentServiceEvent
      summary: Lắng nghe kết quả thanh toán từ Payment Service.
      message:
        oneOf:
          - $ref: '#/components/messages/PaymentSucceededEvent'
          - $ref: '#/components/messages/PaymentFailedEvent'
components:
  schemas:
    RegistrationRequestedEventPayload:
      type: object
      properties:
        registrationId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        employeeId:
          type: string
        registeredAt:
          type: string
          format: date-time
    RegistrationConfirmedEventPayload:
      type: object
      properties:
        registrationId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        employeeId:
          type: string
        paymentId:
          type: string
          format: uuid
          nullable: true
        confirmedAt:
          type: string
          format: date-time
    PaidRegistrationRolledBackEventPayload:
      type: object
      properties:
        registrationId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        reason:
          type: string
        rolledBackAt:
          type: string
          format: date-time
    RegistrationCancelledEventPayload:
      type: object
      properties:
        registrationId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        reason:
          type: string
        cancelledAt:
          type: string
          format: date-time
    ConfirmPaidRegistrationCommandPayload:
      type: object
      required:
        - registrationId
        - paymentId
      properties:
        registrationId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
    RollbackPaidRegistrationCommandPayload:
      type: object
      required:
        - registrationId
        - reason
      properties:
        registrationId:
          type: string
          format: uuid
        reason:
          type: string
          enum:
            - PAYMENT_FAILED
            - PAYMENT_TIMED_OUT
    AsyncReserveTicketCommandPayload:
      type: object
      required:
        - campaignId
        - userId
      properties:
        campaignId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        provider:
          type: object
          properties:
            code:
              type: string
    PaymentSucceededEventPayload:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        amount:
          type: number
        paidAt:
          type: string
          format: date-time
    PaymentFailedEventPayload:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        reason:
          type: string
        failedAt:
          type: string
          format: date-time
  messages:
    RegistrationRequestedEvent:
      messageId: RegistrationRequestedEvent
      name: RegistrationRequestedEvent
      title: RegistrationRequestedEvent
      summary: Phát ra khi nhân viên đăng ký giữ vé thành công (Payment Service nghe để chuẩn bị thanh toán).
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/RegistrationRequestedEventPayload'
    RegistrationConfirmedEvent:
      messageId: RegistrationConfirmedEvent
      name: RegistrationConfirmedEvent
      title: RegistrationConfirmedEvent
      summary: Phát ra khi vé đã được chốt (Vé Free hoặc Vé Paid đã thanh toán xong).
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/RegistrationConfirmedEventPayload'
    PaidRegistrationRolledBackEvent:
      messageId: PaidRegistrationRolledBackEvent
      name: PaidRegistrationRolledBackEvent
      title: PaidRegistrationRolledBackEvent
      summary: Phát ra khi vé bị thu hồi do quá thời hạn thanh toán hoặc thanh toán lỗi.
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/PaidRegistrationRolledBackEventPayload'
    RegistrationCancelledEvent:
      messageId: RegistrationCancelledEvent
      name: RegistrationCancelledEvent
      title: RegistrationCancelledEvent
      summary: Phát ra khi nhân viên chủ động hủy vé.
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/RegistrationCancelledEventPayload'
    ConfirmPaidRegistrationCommand:
      messageId: ConfirmPaidRegistrationCommand
      name: ConfirmPaidRegistrationCommand
      title: ConfirmPaidRegistrationCommand
      summary: Xác nhận đăng ký vé thu phí sau khi PaymentSucceeded.
      traits:
        - $ref: '#/components/messageTraits/commandTrait'
      payload:
        $ref: '#/components/schemas/ConfirmPaidRegistrationCommandPayload'
    RollbackPaidRegistrationCommand:
      messageId: RollbackPaidRegistrationCommand
      name: RollbackPaidRegistrationCommand
      title: RollbackPaidRegistrationCommand
      summary: Compensating transaction khi thanh toán thất bại/timeout.
      traits:
        - $ref: '#/components/messageTraits/commandTrait'
      payload:
        $ref: '#/components/schemas/RollbackPaidRegistrationCommandPayload'
    AsyncReserveTicketCommand:
      messageId: AsyncReserveTicketCommand
      name: AsyncReserveTicketCommand
      title: AsyncReserveTicketCommand
      summary: Lệnh khởi tạo vé không đồng bộ được dội ngược từ Outbox (Flash Sale Fast Path).
      traits:
        - $ref: '#/components/messageTraits/commandTrait'
      payload:
        $ref: '#/components/schemas/AsyncReserveTicketCommandPayload'
    PaymentSucceededEvent:
      messageId: PaymentSucceededEvent
      name: PaymentSucceededEvent
      title: PaymentSucceededEvent
      summary: Lắng nghe từ Payment Service khi thanh toán thành công.
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/PaymentSucceededEventPayload'
    PaymentFailedEvent:
      messageId: PaymentFailedEvent
      name: PaymentFailedEvent
      title: PaymentFailedEvent
      summary: Lắng nghe từ Payment Service khi thanh toán thất bại.
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/PaymentFailedEventPayload'
  messageTraits:
    eventTrait:
      headers:
        type: object
        required:
          - messageId
          - correlationId
          - timestamp
        properties:
          messageId:
            type: string
            format: uuid
          correlationId:
            type: string
            format: uuid
            description: Truy vết Event này thuộc Saga/luồng nghiệp vụ nào.
          timestamp:
            type: string
            format: date-time
    commandTrait:
      headers:
        type: object
        required:
          - messageId
          - correlationId
        properties:
          messageId:
            type: string
            format: uuid
          correlationId:
            type: string
            format: uuid
          replyTo:
            type: string
          timestamp:
            type: string
            format: date-time
