asyncapi: 2.6.0
info:
  title: Payment Service - Async API
  version: 1.0.0
servers:
  productionBroker:
    url: http://localhost:9092
    protocol: kafka
channels:
  Payment:
    description: 'Domain Events của Aggregate `Payment` (Core Domain). Publisher —
      Payment Service.

      `PaymentSucceeded`/`PaymentFailed` là các bước Saga quan trọng

      mà Registration subscribe để Confirm/Rollback.

      '
    publish:
      operationId: emitPaymentEvent
      summary: Payment Service phát sự kiện vòng đời giao dịch thanh toán.
      message:
        oneOf:
          - $ref: '#/components/messages/PaymentSucceededEvent'
          - $ref: '#/components/messages/PaymentFailedEvent'
  Registration:
    description: 'Kênh của Registration Service. Payment Service subscribe để nghe RegistrationRequestedEvent và tạo giao dịch.'
    subscribe:
      operationId: onRegistrationEvent
      summary: Nhận sự kiện yêu cầu thanh toán từ Registration Service.
      message:
        $ref: '#/components/messages/RegistrationRequestedEvent'
components:
  schemas:
    PaymentSucceededEventPayload:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        amount:
          type: number
        providerTxnId:
          type: string
        paidAt:
          type: string
          format: date-time
    PaymentFailedEventPayload:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        reason:
          type: string
        failedAt:
          type: string
          format: date-time
    RegistrationRequestedPayload:
      type: object
      required:
        - registrationId
        - campaignId
        - employeeId
        - amount
        - provider
      properties:
        registrationId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        amount:
          type: number
        provider:
          type: string
  messages:
    PaymentSucceededEvent:
      messageId: PaymentSucceededEvent
      name: PaymentSucceededEvent
      title: PaymentSucceededEvent
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/PaymentSucceededEventPayload'
    PaymentFailedEvent:
      messageId: PaymentFailedEvent
      name: PaymentFailedEvent
      title: PaymentFailedEvent
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/PaymentFailedEventPayload'
    RegistrationRequestedEvent:
      messageId: RegistrationRequestedEvent
      name: RegistrationRequestedEvent
      title: RegistrationRequestedEvent
      summary: Yêu cầu thanh toán từ Registration Service.
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/RegistrationRequestedPayload'
  messageTraits:
    eventTrait:
      headers:
        type: object
        required:
          - messageId
          - correlationId
          - timestamp
        properties:
          messageId:
            type: string
            format: uuid
          correlationId:
            type: string
            format: uuid
            description: Truy vết Event này thuộc Saga/luồng nghiệp vụ nào.
          timestamp:
            type: string
            format: date-time
