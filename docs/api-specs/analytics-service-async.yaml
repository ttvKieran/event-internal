asyncapi: 2.6.0
info:
  title: Analytics Service - Async API
  version: 1.0.0
servers:
  productionBroker:
    url: broker.events.internal.company.vn:9092
    protocol: kafka
    description: Message Broker production (Kafka).
  stagingBroker:
    url: broker.events.staging.company.vn:9092
    protocol: kafka
channels:
  Event:
    description: 'Topic ch?a các Domain Events c?a vòng d?i Event. Analytics Service subscribe d? kh?i t?o d? li?u th?ng kê.'
    subscribe:
      operationId: onEventServiceEvent
      summary: Nh?n c?u hình g?c c?a s? ki?n
      message:
        oneOf:
          - $ref: '#/components/messages/EventCreatedEvent'
          - $ref: '#/components/messages/EventDetailsConfiguredEvent'

  Registration:
    description: 'Topic ch?a Domain Events c?a vi?c dang ký vé. Analytics Service subscribe d? c?p nh?t s? lu?ng dang ký.'
    subscribe:
      operationId: onRegistrationEvent
      summary: Nh?n thay d?i tr?ng thái dang ký vé
      message:
        oneOf:
          - $ref: '#/components/messages/RegistrationConfirmedEvent'
          - $ref: '#/components/messages/PaidRegistrationRolledBackEvent'

  Attendance:
    description: 'Topic ch?a Domain Events c?a vi?c di?m danh. Analytics Service subscribe d? tính check-in rate.'
    subscribe:
      operationId: onAttendanceEvent
      summary: Nh?n thông tin di?m danh QR
      message:
        $ref: '#/components/messages/ParticipantCheckedInEvent'

  Metrics:
    description: 'Topic phát ra Domain Events c?a Aggregate EventMetrics khi có b?t k? ch? s? nào thay d?i. Ph?c v? update realtime qua WebSocket.'
    publish:
      operationId: emitMetricsUpdatedEvent
      summary: Phát s? ki?n t?ng h?p s? li?u dã thay d?i
      message:
        $ref: '#/components/messages/MetricsUpdatedEvent'

components:
  schemas:
    # ------------- SUBSCRIBED PAYLOADS -------------
    EventCreatedEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
    
    EventDetailsConfiguredEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        ticketType:
          type: string
          description: '"FREE" ho?c "PAID"'
        price:
          type: number
          format: float
        maxParticipants:
          type: integer

    RegistrationConfirmedEventPayload:
      type: object
      properties:
        campaignId:
          type: string
          format: uuid
          description: 'Ánh x? v?i eventId'
          
    PaidRegistrationRolledBackEventPayload:
      type: object
      properties:
        campaignId:
          type: string
          format: uuid
          description: 'Ánh x? v?i eventId'

    ParticipantCheckedInEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid

    # ------------- PUBLISHED PAYLOADS -------------
    MetricsUpdatedEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time

  messages:
    EventCreatedEvent:
      name: EventCreatedEvent
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/EventCreatedEventPayload'

    EventDetailsConfiguredEvent:
      name: EventDetailsConfiguredEvent
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/EventDetailsConfiguredEventPayload'

    RegistrationConfirmedEvent:
      name: RegistrationConfirmedEvent
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/RegistrationConfirmedEventPayload'

    PaidRegistrationRolledBackEvent:
      name: PaidRegistrationRolledBackEvent
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/PaidRegistrationRolledBackEventPayload'

    ParticipantCheckedInEvent:
      name: ParticipantCheckedInEvent
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/ParticipantCheckedInEventPayload'

    MetricsUpdatedEvent:
      name: MetricsUpdatedEvent
      summary: S? ki?n gom chung t?t c? thay d?i c?a Metrics
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/MetricsUpdatedEventPayload'

  messageTraits:
    eventTrait:
      headers:
        type: object
        required:
          - messageId
          - eventType
          - timestamp
        properties:
          messageId:
            type: string
            format: uuid
          eventType:
            type: string
          timestamp:
            type: string
            format: date-time
