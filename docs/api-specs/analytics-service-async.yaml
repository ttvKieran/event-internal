asyncapi: 2.6.0
info:
  title: Analytics Service - Async API
  version: 1.0.0
servers:
  productionBroker:
    url: broker.events.internal.company.vn:9092
    protocol: kafka
    description: Message Broker production (minh họa bằng Kafka; tương thích RabbitMQ/Topic-Queue
      tương đương).
  stagingBroker:
    url: broker.events.staging.company.vn:9092
    protocol: kafka
channels:
  Metrics:
    description: 'Domain Events của Aggregate `Event Metrics` (Analytics — CQRS Read
      Model,

      Pure Consumer, mục 3.6). Publisher — Analytics Service, phục vụ realtime update

      cho Organizer Dashboard (vd. qua WebSocket Gateway lắng nghe kênh này).

      '
    publish:
      operationId: emitMetricsEvent
      summary: Analytics Service phát sự kiện cập nhật Projection thống kê.
      message:
        oneOf:
          - $ref: '#/components/messages/RegistrationMetricsUpdatedEvent'
          - $ref: '#/components/messages/AttendanceMetricsUpdatedEvent'
          - $ref: '#/components/messages/CheckInRateCalculatedEvent'
  analytics-commands:
    description: 'Point-to-Point — chỉ **Analytics Service** subscribe (CQRS Projection
      side, Pure

      Consumer, mục 3.6). Command phát sinh từ Registration Metrics Policy và

      Attendance Metrics Policy khi nghe Event tương ứng.

      '
    subscribe:
      operationId: onAnalyticsCommand
      summary: Analytics Service nhận lệnh cập nhật các Metrics Projection.
      message:
        oneOf:
          - $ref: '#/components/messages/UpdateRegistrationMetricsCommand'
          - $ref: '#/components/messages/UpdateAttendanceMetricsCommand'
          - $ref: '#/components/messages/CalculateCheckInRateCommand'
components:
  schemas:
    RegistrationMetricsUpdatedEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        totalRegistrations:
          type: integer
        freeCount:
          type: integer
        paidCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
    AttendanceMetricsUpdatedEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        checkedInCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
    CheckInRateCalculatedEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        checkInRate:
          type: number
          format: float
        calculatedAt:
          type: string
          format: date-time
    UpdateRegistrationMetricsCommandPayload:
      type: object
      required:
        - eventId
      properties:
        eventId:
          type: string
          format: uuid
        delta:
          type: object
          properties:
            freeConfirmed:
              type: integer
            paidConfirmed:
              type: integer
            cancelled:
              type: integer
    UpdateAttendanceMetricsCommandPayload:
      type: object
      required:
        - eventId
      properties:
        eventId:
          type: string
          format: uuid
        delta:
          type: object
          properties:
            checkedIn:
              type: integer
            checkedOut:
              type: integer
    CalculateCheckInRateCommandPayload:
      type: object
      required:
        - eventId
      properties:
        eventId:
          type: string
          format: uuid
  messages:
    RegistrationMetricsUpdatedEvent:
      name: RegistrationMetricsUpdatedEvent
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/RegistrationMetricsUpdatedEventPayload'
    AttendanceMetricsUpdatedEvent:
      name: AttendanceMetricsUpdatedEvent
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/AttendanceMetricsUpdatedEventPayload'
    CheckInRateCalculatedEvent:
      name: CheckInRateCalculatedEvent
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/CheckInRateCalculatedEventPayload'
    UpdateRegistrationMetricsCommand:
      name: UpdateRegistrationMetricsCommand
      title: UpdateRegistrationMetricsCommand
      summary: Cập nhật Registration Metrics Projection (Registration Metrics Policy).
      traits:
        - $ref: '#/components/messageTraits/commandTrait'
      payload:
        $ref: '#/components/schemas/UpdateRegistrationMetricsCommandPayload'
    UpdateAttendanceMetricsCommand:
      name: UpdateAttendanceMetricsCommand
      title: UpdateAttendanceMetricsCommand
      summary: Cập nhật Attendance Metrics Projection (Attendance Metrics Policy).
      traits:
        - $ref: '#/components/messageTraits/commandTrait'
      payload:
        $ref: '#/components/schemas/UpdateAttendanceMetricsCommandPayload'
    CalculateCheckInRateCommand:
      name: CalculateCheckInRateCommand
      title: CalculateCheckInRateCommand
      summary: Tính lại Check-in Rate thời gian thực (Attendance Metrics Policy).
      traits:
        - $ref: '#/components/messageTraits/commandTrait'
      payload:
        $ref: '#/components/schemas/CalculateCheckInRateCommandPayload'
  messageTraits:
    eventTrait:
      headers:
        type: object
        required:
          - messageId
          - correlationId
          - timestamp
        properties:
          messageId:
            type: string
            format: uuid
          correlationId:
            type: string
            format: uuid
            description: Truy vết Event này thuộc Saga/luồng nghiệp vụ nào.
          timestamp:
            type: string
            format: date-time
    commandTrait:
      headers:
        type: object
        required:
          - messageId
          - correlationId
        properties:
          messageId:
            type: string
            format: uuid
            description: ID duy nhất của message (idempotency key).
          correlationId:
            type: string
            format: uuid
            description: Nối các bước trong cùng một Saga/luồng nghiệp vụ.
          replyTo:
            type: string
            description: Return address (topic/queue) để service xử lý gửi phản hồi
              — phục vụ Async Request/Response.
          timestamp:
            type: string
            format: date-time
