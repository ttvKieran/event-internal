openapi: 3.0.3
info:
  title: Notification Service - REST API
  version: 1.0.0
servers:
  - url: https://api.events.internal.company.vn/v1
    description: Production (qua API Gateway)
  - url: https://api.events.staging.company.vn/v1
    description: Staging
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
components:
  schemas:
    ErrorResponse:
      type: object
      description: Envelope Response DTO dùng chung cho mọi API lỗi.
      required:
        - success
        - code
        - message
        - timestamp
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: INVALID_INPUT
        message:
          type: string
          example: Dữ liệu yêu cầu không hợp lệ.
        data:
          type: object
          nullable: true
          example: null
        timestamp:
          type: string
          format: date-time
          example: "2026-08-13T08:00:00.000Z"
        path:
          type: string
          example: /v1/health
