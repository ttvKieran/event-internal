openapi: 3.0.3
info:
  title: Resource Service - REST API
  version: 1.0.0
servers:
  - url: https://api.events.internal.company.vn/v1
    description: Production (qua API Gateway, mục 3.1 Context Map)
  - url: https://api.events.staging.company.vn/v1
    description: Staging
paths:
  /resources:
    post:
      tags:
        - Resource
      summary: Tạo tài nguyên mới (CreateResource)
      description: Command **CreateResource** → Aggregate `Resource` → Event `ResourceCreated`.
        Ghi trong một Bounded Context duy nhất → trả kết quả ngay.
      operationId: createResource
      x-required-role: ORGANIZER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
      responses:
        '201':
          description: Resource đã được tạo thành công với sức chứa ban đầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
        - Resource
      summary: Danh mục tài nguyên (Resource Catalog Read Model)
      operationId: listResources
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum:
              - MEETING_ROOM
              - EVENT_HALL
              - HOT_DESK
              - CARGO_TRUCK
              - LAPTOP
              - PROJECTOR
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách Resource bọc trong ApiResponse DTO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListApiResponse'
  /resources/{resourceId}:
    get:
      tags:
        - Resource
      summary: Chi tiết một Resource
      operationId: getResource
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: OK - Trả về thông tin Resource bọc trong ApiResponse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /resources/{resourceId}/configuration:
    patch:
      tags:
        - Resource
      summary: Cấu hình tài nguyên (ConfigureResource)
      description: Command **ConfigureResource** → Cập nhật thông số kĩ thuật (capacity,
        location, description, image) của Aggregate `Resource`.
      operationId: configureResource
      x-required-role: ORGANIZER
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureResourceRequest'
      responses:
        '200':
          description: Resource đã cập nhật xong thông số kĩ thuật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
components:
  schemas:
    CreateResourceRequest:
      type: object
      required:
        - name
        - type
        - capacity
      properties:
        name:
          type: string
          example: Hội trường lớn A1
        type:
          type: string
          enum:
            - MEETING_ROOM
            - EVENT_HALL
            - HOT_DESK
            - CARGO_TRUCK
            - LAPTOP
            - PROJECTOR
          example: EVENT_HALL
        capacity:
          $ref: '#/components/schemas/Capacity'
        location:
          type: string
          example: Tầng 5, Tòa nhà Viettel
        description:
          type: string
          example: Phòng trang bị hệ thống âm thanh vòm, 2 máy chiếu HD.
        imageUrl:
          type: string
          format: uri
          example: https://cdn.company.com/resources/hall-a1.jpg
    Capacity:
      type: object
      description: Value Object quản lý sức chứa/tải trọng của tài nguyên.
      required:
        - value
        - unit
      properties:
        value:
          type: number
          format: double
          example: 200.0
          description: Giá trị sức chứa hoặc tải trọng (kiểu double)
        unit:
          type: string
          enum:
            - PEOPLE
            - WEIGHT
            - NONE
          example: PEOPLE
          description: Đơn vị tính (PEOPLE cho hội trường/phòng họp, WEIGHT cho xe
            tải, NONE cho thiết bị cá nhân/laptop)
    ResourceApiResponse:
      type: object
      required:
        - success
        - code
        - message
        - data
        - timestamp
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: Xử lý thông tin tài nguyên thành công.
        data:
          $ref: '#/components/schemas/Resource'
        timestamp:
          type: string
          format: date-time
          example: '2026-08-13T08:00:00.000Z'
    Resource:
      type: object
      required:
        - resourceId
        - name
        - type
        - capacity
        - status
      properties:
        resourceId:
          type: string
          format: uuid
          example: c1a8b9e0-1234-5678-9abc-def012345678
        name:
          type: string
          example: Hội trường lớn A1
        type:
          type: string
          enum:
            - MEETING_ROOM
            - EVENT_HALL
            - HOT_DESK
            - CARGO_TRUCK
            - LAPTOP
            - PROJECTOR
          example: EVENT_HALL
        capacity:
          $ref: '#/components/schemas/Capacity'
        location:
          type: string
          example: Tầng 5, Tòa nhà Viettel
        description:
          type: string
          example: Phòng trang bị hệ thống âm thanh vòm, 2 máy chiếu HD và điều hòa
            âm trần.
        imageUrl:
          type: string
          format: uri
          example: https://cdn.company.com/resources/hall-a1.jpg
        status:
          type: string
          enum:
            - AVAILABLE
            - FULLY_BOOKED
            - MAINTENANCE
            - INACTIVE
          example: AVAILABLE
        createdAt:
          type: string
          format: date-time
    ResourceListApiResponse:
      type: object
      required:
        - success
        - code
        - message
        - data
        - timestamp
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: Lấy danh sách tài nguyên thành công.
        data:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        timestamp:
          type: string
          format: date-time
          example: '2026-08-13T08:00:00.000Z'
    ConfigureResourceRequest:
      type: object
      description: Cập nhật thông số kĩ thuật (sức chứa, vị trí, tên, mô tả, ảnh)
        của tài nguyên.
      properties:
        name:
          type: string
          example: Hội trường lớn A1 (Đã bảo trì âm thanh)
        type:
          type: string
          enum:
            - MEETING_ROOM
            - EVENT_HALL
            - HOT_DESK
            - CARGO_TRUCK
            - LAPTOP
            - PROJECTOR
          example: EVENT_HALL
        capacity:
          $ref: '#/components/schemas/Capacity'
        location:
          type: string
          example: Tầng 5, Tòa nhà Viettel
        description:
          type: string
          example: Cập nhật mô tả hệ thống âm thanh mới.
        imageUrl:
          type: string
          format: uri
          example: https://cdn.company.com/resources/hall-a1-new.jpg

    ErrorResponse:
      type: object
      description: Envelope Response DTO dùng chung cho mọi API lỗi (Trường phái B).
      required:
        - success
        - code
        - message
        - timestamp
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: INVALID_INPUT
        message:
          type: string
          example: Dữ liệu yêu cầu không hợp lệ.
        data:
          type: object
          nullable: true
          example: null
        timestamp:
          type: string
          format: date-time
          example: '2026-08-13T08:00:00.000Z'
        path:
          type: string
          example: /v1/auth/login

  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: BAD_REQUEST
            message: Dữ liệu đầu vào không hợp lệ.
            data: null
            timestamp: '2026-08-13T08:00:00.000Z'
            path: /v1/api
    Unauthorized:
      description: Thiếu hoặc JWT không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: UNAUTHORIZED
            message: Xác thực không thành công hoặc JWT hết hạn.
            data: null
            timestamp: '2026-08-13T08:00:00.000Z'
            path: /v1/api
    Forbidden:
      description: Role JWT không đủ quyền (vd. cần ORGANIZER).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: FORBIDDEN
            message: Tài khoản không đủ quyền truy cập tài nguyên này.
            data: null
            timestamp: '2026-08-13T08:00:00.000Z'
            path: /v1/api
    NotFound:
      description: Không tìm thấy tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: NOT_FOUND
            message: Tài nguyên được yêu cầu không tồn tại.
            data: null
            timestamp: '2026-08-13T08:00:00.000Z'
            path: /v1/api
    Conflict:
      description: Xung đột trạng thái (vd. đã PUBLISHED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: CONFLICT
            message: Xung đột trạng thái tài nguyên.
            data: null
            timestamp: '2026-08-13T08:00:00.000Z'
            path: /v1/api
  parameters:
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
