asyncapi: 2.6.0
info:
  title: Event Service - Async API
  version: 1.0.0
servers:
  productionBroker:
    url: broker.events.internal.company.vn:9092
    protocol: kafka
    description: Message Broker production (minh họa bằng Kafka; tương thích RabbitMQ/Topic-Queue
      tương đương).
  stagingBroker:
    url: broker.events.staging.company.vn:9092
    protocol: kafka
channels:
  Event:
    description: 'Domain Events của Aggregate `Event`. Publisher — Event Planning
      Service.

      Subscribers: Registration (At 20h Policy nghe `EventPublished`), Attendance

      (Event Start/End QR Policy nghe `EventStarted`/`EventEnded`), Notification,
      Analytics.

      '
    publish:
      operationId: emitEventPlanningEvent
      summary: Event Planning Service phát sự kiện vòng đời sự kiện.
      message:
        oneOf:
          - $ref: '#/components/messages/EventCreatedEvent'
          - $ref: '#/components/messages/EventDetailsConfiguredEvent'
          - $ref: '#/components/messages/EventPublishedEvent'
          - $ref: '#/components/messages/EventCancelledEvent'
          - $ref: '#/components/messages/EventStartedEvent'
          - $ref: '#/components/messages/EventEndedEvent'
components:
  schemas:
    EventCreatedEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
    EventDetailsConfiguredEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        ticketType:
          type: string
          enum:
            - FREE
            - PAID
        allocatedResources:
          type: array
          items:
            type: object
            properties:
              resourceId:
                type: string
                format: uuid
              quantity:
                type: number
                format: double
        maxParticipants:
          type: integer
        registrationOpenAt:
          type: string
          format: date-time
        registrationCloseAt:
          type: string
          format: date-time
    EventPublishedEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
    EventCancelledEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        reason:
          type: string
        cancelledAt:
          type: string
          format: date-time
    EventStartedEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
    EventEndedEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        endedAt:
          type: string
          format: date-time
  messages:
    EventCreatedEvent:
      name: EventCreatedEvent
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/EventCreatedEventPayload'
    EventDetailsConfiguredEvent:
      name: EventDetailsConfiguredEvent
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/EventDetailsConfiguredEventPayload'
    EventPublishedEvent:
      name: EventPublishedEvent
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/EventPublishedEventPayload'
    EventCancelledEvent:
      name: EventCancelledEvent
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/EventCancelledEventPayload'
    EventStartedEvent:
      name: EventStartedEvent
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/EventStartedEventPayload'
    EventEndedEvent:
      name: EventEndedEvent
      traits:
        - $ref: '#/components/messageTraits/eventTrait'
      payload:
        $ref: '#/components/schemas/EventEndedEventPayload'
  messageTraits:
    eventTrait:
      headers:
        type: object
        required:
          - messageId
          - correlationId
          - timestamp
        properties:
          messageId:
            type: string
            format: uuid
          correlationId:
            type: string
            format: uuid
            description: Truy vết Event này thuộc Saga/luồng nghiệp vụ nào.
          timestamp:
            type: string
            format: date-time
