asyncapi: 2.6.0
info:
  title: Event Service - Async API
  version: 1.0.0
servers:
  productionBroker:
    url: http://localhost:9092
    protocol: kafka
    description: Message Broker
channels:
  Event:
    description:
      "Domain Events của Aggregate `Event`. Publisher — Event Planning
      Service.
      Subscribers: Registration (At 20h Policy nghe `EventPublished`), Attendance
      (Event Start/End QR Policy nghe `EventStarted`/`EventEnded`), Notification, Analytics."
    publish:
      operationId: emitEventPlanningEvent
      summary: Event Service phát sự kiện vòng đời sự kiện.
      message:
        oneOf:
          - $ref: "#/components/messages/EventCreatedEvent"
          - $ref: "#/components/messages/EventDetailsConfiguredEvent"
          - $ref: "#/components/messages/EventPublishedEvent"
          - $ref: "#/components/messages/EventCancelledEvent"
components:
  schemas:
    EventCreatedEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
    EventDetailsConfiguredEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        ticketType:
          type: string
          enum:
            - FREE
            - PAID
        allocatedResources:
          type: array
          items:
            type: object
            properties:
              resourceId:
                type: string
                format: uuid
              quantity:
                type: number
                format: double
        maxParticipants:
          type: integer
        registrationOpenAt:
          type: string
          format: date-time
        registrationCloseAt:
          type: string
          format: date-time
    EventPublishedEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
    EventCancelledEventPayload:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        reason:
          type: string
        cancelledAt:
          type: string
          format: date-time
  messages:
    EventCreatedEvent:
      messageId: EventCreatedEvent
      name: EventCreatedEvent
      title: EventCreatedEvent
      summary: Phát ra khi sự kiện được tạo mới ở trạng thái DRAFT.
      traits:
        - $ref: "#/components/messageTraits/eventTrait"
      payload:
        $ref: "#/components/schemas/EventCreatedEventPayload"
    EventDetailsConfiguredEvent:
      messageId: EventDetailsConfiguredEvent
      name: EventDetailsConfiguredEvent
      title: EventDetailsConfiguredEvent
      summary: Phát ra khi sự kiện đã được cấu hình chi tiết (số lượng vé, thời gian mở/đóng).
      traits:
        - $ref: "#/components/messageTraits/eventTrait"
      payload:
        $ref: "#/components/schemas/EventDetailsConfiguredEventPayload"
    EventPublishedEvent:
      messageId: EventPublishedEvent
      name: EventPublishedEvent
      title: EventPublishedEvent
      summary: Phát ra khi sự kiện chính thức được PUBLISH (Registration Service tự động kích hoạt chiến dịch).
      traits:
        - $ref: "#/components/messageTraits/eventTrait"
      payload:
        $ref: "#/components/schemas/EventPublishedEventPayload"
    EventCancelledEvent:
      messageId: EventCancelledEvent
      name: EventCancelledEvent
      title: EventCancelledEvent
      summary: Phát ra khi sự kiện bị hủy bỏ (Registration Service sẽ tự động hủy các vé liên quan).
      traits:
        - $ref: "#/components/messageTraits/eventTrait"
      payload:
        $ref: "#/components/schemas/EventCancelledEventPayload"
  messageTraits:
    eventTrait:
      headers:
        type: object
        required:
          - messageId
          - correlationId
          - timestamp
        properties:
          messageId:
            type: string
            format: uuid
          correlationId:
            type: string
            format: uuid
            description: Truy vết Event này thuộc Saga/luồng nghiệp vụ nào.
          timestamp:
            type: string
            format: date-time
